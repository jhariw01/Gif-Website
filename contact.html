<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact GIPHY Search Engine.">
  <title>Contact | GIPHY Search Engine</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/contact.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">🎞️ GIPHY <span>Search Engine</span></a>
    <nav class="nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="trending.html">Trending</a><a class="active" href="contact.html">Contact</a></nav>
  </header>
  <main class="page-main contact-main">
    <section class="contact-card">
      <span class="eyebrow">LET'S TALK</span><h1>Contact Us</h1>
      <p class="muted">Have a question or suggestion? Send us a message.</p>
      <form id="contact-form" novalidate>
        <div class="form-field"><label for="full-name">Full Name</label><input id="full-name" name="fullName" type="text" placeholder="Your full name" required><small class="field-error" id="name-error"></small></div>
        <div class="form-field"><label for="email">Email Address</label><input id="email" name="email" type="email" placeholder="you@example.com" required><small class="field-error" id="email-error"></small></div>
        <div class="form-field"><label for="message">Message</label><textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea><small class="field-error" id="message-error"></small></div>
        <button class="button button-primary full-width" type="submit">Submit Message</button>
        <p class="message" id="form-status" role="status" aria-live="polite"></p>
      </form>
      <p class="fine-print">Demo form only: your message is validated in this browser and is not emailed or stored.</p>
    </section>
  </main>
  <footer class="site-footer">
    <a class="brand" href="index.html">🎞️ GIPHY <span>Search Engine</span></a><p>© <span id="year"></span> GIPHY Search Engine.</p>
    <div class="footer-links"><a href="index.html">Home</a><a href="trending.html">Trending</a><a href="contact.html">Contact</a></div>
  </footer>
</body>
</html>
